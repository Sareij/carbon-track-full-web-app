spring:
  application:
    name: carbontrack-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/carbontrack?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:sar1}

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only VALIDATES that entities match the tables.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8090
